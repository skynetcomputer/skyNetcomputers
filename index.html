

<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>SkyNet Computers</title> <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #071a35, #0875e1);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      color: #0875e1;
      font-size: 32px;
      margin-bottom: 8px;
    }

    .logo p {
      color: #666;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #222;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #0875e1;
      box-shadow: 0 0 0 3px rgba(8,117,225,0.1);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .file-area {
      border: 2px dashed #0875e1;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      background: #f5f9ff;
    }

    .file-area input {
      border: none;
      box-shadow: none;
      padding: 5px;
      background: transparent;
    }

    #fileName {
      margin-top: 10px;
      font-size: 14px;
      color: #555;
      word-break: break-word;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #0875e1;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #075bb0;
    }

    .info {
      margin-top: 15px;
      padding: 12px;
      background: #f0f7ff;
      border-radius: 8px;
      color: #555;
      font-size: 13px;
      text-align: center;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #777;
      font-size: 12px;
    }

    @media (max-width: 500px) {
      .container {
        padding: 22px;
      }

      .logo h1 {
        font-size: 27px;
      }
    }
  </style></head><body> <div class="container"><div class="logo">
  <h1>SkyNet Computers</h1>
  <p>Computer Sales & Services</p>
</div>

<h2>Send Us a Message</h2>

<!--
  IMPORTANT:
  This sends the form to:
  skynetcomputers13@gmail.com

  multipart/form-data is required for file uploads.
-->

<form
  action="https://formsubmit.co/skynetcomputers13@gmail.com"
  method="POST"
  enctype="multipart/form-data"
  id="contactForm"
>

  <!-- FormSubmit settings -->

  <input
    type="hidden"
    name="_subject"
    value="New Message - SkyNet Computers"
  >

  <input
    type="hidden"
    name="_captcha"
    value="true"
  >

  <!--
    After submission, FormSubmit can redirect the user.
    Change this later if you want a custom thank-you page.
  -->

  <div class="form-group">

    <label for="name">
      Name *
    </label>

    <input
      type="text"
      id="name"
      name="name"
      placeholder="Enter your name"
      required
    >

  </div>


  <div class="form-group">

    <label for="email">
      Email *
    </label>

    <input
      type="email"
      id="email"
      name="email"
      placeholder="Enter your email"
      required
    >

  </div>


  <div class="form-group">

    <label for="phone">
      Phone Number
    </label>

    <input
      type="tel"
      id="phone"
      name="phone"
      placeholder="Enter your phone number"
    >

  </div>


  <div class="form-group">

    <label for="message">
      Message *
    </label>

    <textarea
      id="message"
      name="message"
      placeholder="Write your message..."
      required
    ></textarea>

  </div>


  <div class="form-group">

    <label for="attachment">
      📎 Attach File
    </label>

    <div class="file-area">

      <input
        type="file"
        id="attachment"
        name="attachment"
      >

      <div id="fileName">
        No file selected
      </div>

    </div>

  </div>


  <button type="submit">
    📧 Send Message
  </button>


  <div class="info">
    Your message and attached file will be sent to
    <strong>skynetcomputers13@gmail.com</strong>
  </div>

</form>


<div class="footer">
  © 2026 SkyNet Computers. All Rights Reserved.
</div>

  </div> <script>

    const fileInput =
      document.getElementById("attachment");

    const fileName =
      document.getElementById("fileName");


    fileInput.addEventListener("change", function () {

      if (this.files.length === 0) {

        fileName.textContent =
          "No file selected";

        return;
      }

      const file = this.files[0];

      const sizeMB =
        (file.size / (1024 * 1024)).toFixed(2);

      fileName.innerHTML =
        "📎 <strong>" +
        file.name +
        "</strong><br>" +
        sizeMB +
        " MB";

    });


    /*
      Basic file-size warning.

      FormSubmit currently documents
      a maximum total upload size of 10 MB.
    */

    document
      .getElementById("contactForm")
      .addEventListener("submit", function (event) {

        if (fileInput.files.length > 0) {

          const file =
            fileInput.files[0];

          const maxSize =
            10 * 1024 * 1024;

          if (file.size > maxSize) {

            event.preventDefault();

            alert(
              "File is too large. Please select a file smaller than 10 MB."
            );

          }

        }

      });

  </script></body>
</html>
